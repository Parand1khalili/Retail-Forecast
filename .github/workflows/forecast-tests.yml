name: Forecast Python regression checks
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: forecasting/requirements.txt
      - run: python -m pip install -r forecasting/requirements.txt
      - name: Python syntax
        run: python -m compileall -q forecasting
      - name: Unit and synthetic integration tests
        run: python -m unittest discover -s forecasting -p "test_*.py" -v
      - name: Synthetic selection-only speed and memory
        run: python forecasting/benchmark_selection_overhead.py
      - name: Browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('forecasting/app_ui.html').read_text(encoding='utf-8')
          script=html.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/forecast-ui.js').write_text(script,encoding='utf-8')
          PY
          node --check /tmp/forecast-ui.js
      - name: Model Lab UI behavior
        run: node forecasting/test_backtest_ui.cjs
      - name: Publish test status to the commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            state=success
            description="Python regression and UI syntax checks passed"
          else
            state=failure
            description="Forecasting regression checks failed"
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f context="forecasting/regression" \
            -f state="$state" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
